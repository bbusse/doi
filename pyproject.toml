[project]
name = "doi"
version = "0.1.0"
description = "Data of Interest"
authors = [
    { name = "Björn Busse", email = "bj.rn@baerlin.eu" }
]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32.5",
    "paho-mqtt>=2.1.0",
    "py3status @ git+https://github.com/bbusse/py3status@oneshot"
]

[project.optional-dependencies]
# Only needed once Calendar.next_events_today() is actually wired up
google-calendar = [
    "google-api-python-client>=2.0.0",
    "google-auth>=2.0.0",
    "pytz>=2023.3"
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
