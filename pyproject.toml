[project]
name = "doi"
version = "0.1.0"
description = "Data of Interest"
authors = [
    { name = "Björn Busse", email = "bj.rn@baerlin.eu" }
]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "hntop>=0.0.10",
    "requests>=2.32.5",
    "paho-mqtt>=2.1.0",
    "py3status @ git+https://github.com/bbusse/py3status@oneshot"
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
